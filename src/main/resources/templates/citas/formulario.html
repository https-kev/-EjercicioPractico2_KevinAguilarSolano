<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


    <head>

        <title>Nueva cita</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">

    </head>


    <body>


        <div class="container mt-5">


            <h1>
                Agendar cita médica
            </h1>


            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>



            <form th:action="@{/citas/guardar}"
                  th:object="${cita}"
                  method="post">



                <div class="mb-3">

                    <label class="form-label">
                        Especialidad
                    </label>


                    <select class="form-select"
                            th:field="*{especialidad}">


                        <option value="">
                            Seleccione una especialidad
                        </option>


                        <option th:each="esp : ${especialidades}"
                                th:value="${esp}"
                                th:text="${esp}">
                        </option>


                    </select>


                </div>





                <div class="mb-3">


                    <label class="form-label">
                        Fecha y hora
                    </label>


                    <input type="datetime-local"
                           class="form-control"
                           th:field="*{fechaHora}">


                </div>





                <div class="mb-3">


                    <label class="form-label">
                        Costo
                    </label>


                    <input type="number"
                           class="form-control"
                           th:field="*{costo}">


                </div>




                <button class="btn btn-success"
                        type="submit">

                    Guardar cita

                </button>



            </form>



        </div>


    </body>


</html>
